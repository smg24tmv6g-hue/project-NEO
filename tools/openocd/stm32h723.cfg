# ST-Link + STM32H723 (projectneo) — OpenOCD 烧录/调试配置
# 2026-11-14 定稿：两处关键修正
#   1) interface 必须用 stlink-dap.cfg（DAP 直连驱动），stlink.cfg 是 HLA 老驱动，连不上 H7
#   2) transport 用 dapdirect_swd（HLA 驱动只接受 hla_swd/hla_jtag；swd 是别的适配器的名字）
source [find interface/stlink-dap.cfg]
transport select dapdirect_swd
adapter speed 2000
source [find target/stm32h7x.cfg]
